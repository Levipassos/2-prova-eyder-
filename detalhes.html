<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes - Catálogo Interativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo"><a href="catalogo.html">FilmesFlix</a></h1>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="catalogo.html">Catálogo</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                </ul>
                <button id="theme-toggle" class="theme-toggle" title="Alternar tema">
                    🌙
                </button>
            </nav>
        </div>
    </header>

    <main class="main-content container">
        <div class="loading-spinner-container">
            <div class="loading-spinner"></div>
            <p>Carregando detalhes...</p>
        </div>

        <div class="error-message hidden">
            <p>Ocorreu um erro ao carregar os dados. Tente novamente mais tarde.</p>
        </div>

        <section class="details-section hidden">
            <div class="details-container">
                <div class="details-poster-container">
                    <img src="" alt="" class="details-poster">
                </div>
                
                <div class="details-content">
                    <div class="details-header">
                        <div class="title-rating-row">
                            <h2 class="details-title"></h2>
                            <div class="rating">
                                <span class="rating-value"></span>/10
                            </div>
                        </div>
                        <p class="details-meta"></p>
                    </div>

                    <div class="details-body">
                        <div class="synopsis-section">
                            <h3>Sinopse</h3>
                            <div class="synopsis-container">
                                <p class="synopsis"></p>
                            </div>
                        </div>

                        <div class="missing-data-alert hidden">
                            <p><strong>Aviso:</strong> Sinopse não disponível para este título.</p>
                        </div>

                        <section class="seasons-section hidden">
                            <h3>Temporadas e Episódios</h3>
                            <div class="season-list"></div>
                        </section>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Catálogo Interativo. Desenvolvido por Levi Passos, Mayara Lima, Irapuam Junio.</p>
        </div>
    </footer>

    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/detalhes.js"></script>
</body>
</html>
